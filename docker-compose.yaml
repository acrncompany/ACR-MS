services:
  postgres:
    image: postgres:18
    container_name: acrms-postgres
    restart: unless-stopped
    environment:
      # Owner / migration role (superuser). Used only by Prisma migrate and the dev seed.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Password for the runtime role acrms_app, created by docker/postgres/init/01-app-role.sh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - acrms_pgdata:/var/lib/postgresql
      # Init scripts run only when the data volume is empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  acrms_pgdata:
